<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13243e">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>إدارة المرفأ | اختيار التطبيق</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./owner-icon-192.png">
<link rel="apple-touch-icon" href="./owner-icon-192.png">
<script src="./launcher.js" defer></script>
<style>
:root{color-scheme:light;--blue:#175783;--ink:#20344c;--muted:#60758c;--border:#dce7ef}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:linear-gradient(165deg,#13243e 0%,#1b3d59 35%,#eef4f8 35%,#eef4f8 100%);font:16px/1.7 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:28px 20px max(28px,env(safe-area-inset-bottom))}
main{width:min(100%,480px)}
header{text-align:center;color:#fff;margin-bottom:26px;background:#17324c;border-radius:22px;padding:24px 14px}
.brand{display:grid;place-items:center;width:75px;height:75px;margin:0 auto 14px;border:1px solid #ffffff40;border-radius:23px;background:#ffffff12;font-size:34px}
h1{font-size:clamp(24px,5vw,31px);margin:0;font-weight:800}
header p{margin:7px 0;color:#e0e9f2;font-size:15px}
nav{display:grid;gap:14px}
.choice{display:flex;align-items:center;gap:15px;min-height:112px;padding:19px;text-decoration:none;color:var(--ink);background:white;border:1px solid var(--border);border-radius:20px;box-shadow:0 12px 28px #13243e16;transition:transform .15s ease}
.choice:hover,.choice:focus-visible{transform:translateY(-2px);outline:3px solid #5991b4;outline-offset:3px}
.choice img{width:62px;height:62px;flex:0 0 62px;border-radius:16px}
.choice strong{font-size:21px;display:block;line-height:1.4}
.choice small{font-size:13px;display:block;margin-top:6px;color:var(--muted)}
.arrow{margin-inline-start:auto;font-size:24px;color:var(--blue)}
.central{border-inline-start:5px solid #c4a15e}.fleet{border-inline-start:5px solid #267ca9}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:23px}
@media(max-width:350px){body{padding:20px 12px}.choice{gap:10px;padding:14px}.choice strong{font-size:18px}.choice img{width:48px;height:48px;flex-basis:48px}}
@media(prefers-reduced-motion:reduce){.choice{transition:none}}
body{background:linear-gradient(180deg,#142b43 0%,#1d485a 43%,#eef3f7 43%,#eef3f7 100%);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}header{background:transparent;box-shadow:none;padding:20px 8px;margin-bottom:15px}.brand{background:#ffffff12;border-radius:20px;width:68px;height:68px}.choice{min-height:105px;border-radius:16px;box-shadow:0 5px 22px #13243e14}.choice img{border-radius:14px}.choice small{line-height:1.5}.central{border-inline-start:4px solid #bd9c55}.fleet{border-inline-start:4px solid #238b85}footer{margin-top:20px} @media(prefers-color-scheme:dark){body{background:linear-gradient(180deg,#142b43 0%,#1d485a 43%,#101f2d 43%)}.choice{background:#1a3042;border-color:#385265;color:#e7eef4}.choice small,footer{color:#b1c6d4}.arrow{color:#8fd9df}}</style>
</head><body>
<main><header><div class="brand" aria-hidden="true">⚓</div><h1>الإدارة الذكية لآليات المرفأ</h1><p>اختر التطبيق الذي تريد الدخول إليه</p></header>
<nav aria-label="اختيار التطبيق">
<a class="choice central" href="./owner.html"><img src="./owner-icon-192.png" width="62" height="62" alt=""><span><strong>الإدارة المركزية</strong><small>خاص بحساب المالك</small></span><span class="arrow" aria-hidden="true">‹</span></a>
<a class="choice fleet" href="./user/"><img src="./user/user-icon-192.png" width="62" height="62" alt=""><span><strong>إدارة الآليات</strong><small>دخول مباشر دون حساب</small></span><span class="arrow" aria-hidden="true">‹</span></a>
</nav><footer>إصدار 10.7 · اختيار مساحة العمل</footer></main>
</body></html>
